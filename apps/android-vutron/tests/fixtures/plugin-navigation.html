<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><div id="app"></div><script type="module">
import {createApp,h,ref} from 'vue'
import {createPinia} from 'pinia'
import {i18n} from '/src/platform/i18n'
import '/src/style.css'
import '/src/adaptive.css'
import '/src/platform/appearance'
import PluginLibraryView from '/src/components/PluginLibraryView.vue'
import ActionDialog from '/src/components/ActionDialog.vue'
import {pluginBackend} from '/tests/fixtures/music-plugin-native.mock.js'
pluginBackend.plugins.forEach(plugin=>plugin.enabled=true)
const section=ref('library'),instance=ref(),plays=[]

window.pluginNavigation={app,section,instance,backend:pluginBackend,plays}
</script></body></html>
